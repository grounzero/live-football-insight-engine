name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI never downloads the Metrica dataset and never trains the reference model.
# Every test runs against a seeded synthetic match generated in-process, which
# keeps the pipeline fast and avoids depending on a third-party host that
# publishes the data under no formal licence.
env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint, types and tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Installed into .venv rather than the system interpreter so that
      # pyrightconfig.json's venvPath resolves to the same place here as it does
      # locally and in the editor. Without it pyright silently fails to resolve
      # numpy, torch and friends, and reports thousands of phantom errors.
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check src tests

      - name: Format check
        run: .venv/bin/ruff format --check src tests

      - name: Type check (mypy)
        run: .venv/bin/mypy

      # Once only. pyrightconfig.json pins pythonVersion, so every matrix leg
      # would analyse identically; running it per version costs time and proves
      # nothing extra.
      - name: Type check (pyright, strict)
        if: matrix.python == '3.13'
        run: .venv/bin/pyright

      # requires-python is >=3.11, so the floor has to be exercised as a
      # *runtime*, not just as a checkout the linters happen to parse. Imports
      # and the console script catch packaging and entry-point breakage that
      # the test suite can miss when it runs from the source tree.
      - name: Runtime import and CLI smoke
        run: |
          .venv/bin/python -c "import football_insights, football_insights.cli"
          .venv/bin/python -c "import football_insights.data"
          .venv/bin/football-insights --help > /dev/null

      - name: Tests
        run: .venv/bin/pytest -q -m "not requires_data" --cov --cov-report=term-missing

  smoke:
    name: Inference and ONNX parity smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"

      - name: Train a tiny model on synthetic data and check ONNX parity
        # Deliberately not the reference model: this proves the export and
        # runtime paths work, not that a two-epoch model is any good.
        run: |
          python - <<'PY'
          import numpy as np, tempfile
          from pathlib import Path
          from football_insights.config import ModelSettings
          from football_insights.models.temporal import train_temporal
          from football_insights.models.export_onnx import export, check_parity

          rng = np.random.default_rng(0)
          x = rng.normal(size=(600, 50, 39)).astype(np.float32)
          y = (x[:, -1, 0] > 0).astype(np.int8)
          settings = ModelSettings(max_epochs=2, hidden_size=16, early_stopping_patience=2)
          model, _ = train_temporal(x[:500], y[:500], x[500:], y[500:], settings)

          with tempfile.TemporaryDirectory() as tmp:
              path = export(model, Path(tmp) / "m.onnx")
              report = check_parity(model, path, x[:128])
          print(report)
          assert report["within_tolerance"], report
          assert report["max_rank_change"] == 0, report
          PY

      - name: Service smoke test
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from football_insights.config import Settings
          from football_insights.data.synthetic import generate_synthetic_match
          from football_insights.models.heuristic import HeuristicPredictor
          from football_insights.serving.app import create_app
          from football_insights.serving.engine import InsightEngine
          from football_insights.serving.metrics import Metrics

          settings = Settings()
          match = generate_synthetic_match(seed=5, period_duration_s=30.0)
          metrics = Metrics()
          engine = InsightEngine(
              settings=settings, orientation=match.orientation, events=match.events,
              frame_rate=match.frame_rate, predictor=HeuristicPredictor(), metrics=metrics,
          )
          client = TestClient(create_app(settings, engine, None, metrics))
          assert client.get("/health").status_code == 200
          assert client.get("/ready").json()["ready"] is True
          body = client.get("/metrics").text
          assert "fi_model_predictions_total" in body
          assert "fi_insight_suppressed_total" in body
          print("service smoke test ok")
          PY

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"

      - name: Audit dependencies
        # Advisory: a new CVE in a transitive dependency should surface without
        # blocking an unrelated pull request. Expressed with continue-on-error
        # rather than `|| true` so the step still reports its real result.
        continue-on-error: true
        # --skip-editable for the same reason as `make audit`: this project is
        # not on PyPI, so auditing the editable install only reports itself as
        # missing and says nothing about our dependencies.
        run: pip-audit --progress-spinner off --skip-editable

  demo:
    name: Build the demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          # The lockfile, not the manifest: keying the cache on package.json
          # reuses a tree resolved from a different lockfile.
          cache-dependency-path: demo/package-lock.json
      # `npm ci`, not `npm install`: the lockfile is committed and must be the
      # thing that decides what gets built.
      - run: npm ci
        working-directory: demo
      - run: npm run build
        working-directory: demo
      # Structure only — that the live region, the scrolling body and the
      # confidence panel's slots survive a change. Geometry is not assertable
      # from markup and is measured in a browser by hand.
      - run: npm run test:ssr
        working-directory: demo

  container:
    name: Build and smoke-test the container
    runs-on: ubuntu-latest
    # The image is what actually gets deployed, so this job starts it and drives
    # the running service rather than checking that a CLI command prints
    # something. Everything it asserts was previously assumed.
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: football-insights:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # No mounts, no dataset, a non-default port, and a bounded wait on every
      # step. The script dumps container logs itself on any failure.
      - name: Smoke-test the running container
        run: ./scripts/container-smoke.sh
        env:
          IMAGE: football-insights:ci
          SMOKE_PORT: "8087"
      # Belt and braces: the script's own trap prints logs, but a failure in the
      # step above (or a runner kill) should not lose them.
      - name: Container logs
        if: failure()
        run: docker ps -a --format '{{.Names}}' | xargs -r -I{} sh -c 'echo "== {}"; docker logs {} 2>&1 | tail -n 200'
